services:
  # ── Backend (FastAPI) ──────────────────────────────────────────
  - type: web
    name: warehouse-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        value: mongodb+srv://retailhubcoustomer_db_user:rahul123@cluster0.4hzjo9u.mongodb.net/
      - key: DB_NAME
        value: warehouse_shiplink
      - key: ADMIN_EMAIL
        value: admin@shiplink.com
      - key: ADMIN_PASSWORD
        value: Admin@123
      - key: JWT_SECRET
        value: super_secret_jwt_key_2024
      - key: CORS_ORIGINS
        value: "*"

  # ── Frontend (React) ───────────────────────────────────────────
  - type: web
    name: warehouse-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://warehouse-backend.onrender.com
